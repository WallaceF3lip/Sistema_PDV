<div class="users">
  <div class="users__header">
    <div>
      <h2 class="headline-lg">Usuários</h2>
      <p class="body-md text-muted">Gerenciar equipe</p>
    </div>
    <button class="btn btn-primary" (click)="openModal()">+ Novo Usuário</button>
  </div>

  <app-data-table [columns]="columns" [data]="users" [loading]="isLoading" emptyMessage="Nenhum usuário cadastrado">

    <!-- Avatar: inicial do nome -->
    <ng-template dtCell="avatar" let-row>
      <div class="dt-avatar">{{ row.name.charAt(0).toUpperCase() }}</div>
    </ng-template>

    <!-- Info: nome -->
    <ng-template dtCell="info" let-row>
      <div class="dt-info">
        <span class="dt-info__title">{{ row.name }}</span>
      </div>
    </ng-template>

    <!-- email -->
    <ng-template dtCell="email" let-row>
      <div class="dt-info">
        <span class="dt-info__title">{{ row.email }}</span>
      </div>
    </ng-template>

    <!-- Cargo: badge -->
    <ng-template dtCell="role" let-row>
      <span class="badge"
        [class.badge--primary]="row.role === 'ADMIN'"
        [class.badge--muted]="row.role === 'OPERATOR'">
        {{ row.role === 'ADMIN' ? 'Admin' : 'Operador' }}
      </span>
    </ng-template>

    <!-- Status: toggle -->
    <ng-template dtCell="is_active" let-row>
      <div class="toggle" [class.active]="row.is_active" (click)="toggleUser(row)"></div>
    </ng-template>

    <!-- Ações -->
    <ng-template dtCell="actions" let-row>
      <div class="dt-actions">
        <button class="btn btn-ghost" (click)="editUser(row)">Editar</button>
      </div>
    </ng-template>

  </app-data-table>
</div>

@if (showModal) {
<div class="glass-overlay" (click)="closeModal()">
  <div class="modal-card card animate-scale-in" (click)="$event.stopPropagation()">
    <h3 class="headline-md">{{ editingUser ? 'Editar Usuário' : 'Novo Usuário' }}</h3>

    <form class="modal-form" (ngSubmit)="saveUser()">
      <div class="form-group">
        <label class="label-sm text-muted">NOME</label>
        <input class="input-field" [(ngModel)]="form.name" name="name" required />
      </div>
      <div class="form-group">
        <label class="label-sm text-muted">E-MAIL</label>
        <input class="input-field" type="email" [(ngModel)]="form.email" name="email" required />
      </div>
      <div class="form-group">
        <label class="label-sm text-muted">SENHA {{ editingUser ? '(deixe vazio para manter)' : '' }}</label>
        <input class="input-field" type="password" [(ngModel)]="form.password" name="password"
          [required]="!editingUser" />
      </div>
      <div class="form-group">
        <label class="label-sm text-muted">CARGO</label>
        <select class="input-field" [(ngModel)]="form.role" name="role">
          <option value="OPERATOR">Operador</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaving">
          {{ isSaving ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
</div>
}
